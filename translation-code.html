<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
  <title>سلسار | عرض الترجمة</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#081426;font-family:Calibri,Arial,sans-serif}.card{max-width:620px;margin:12vh auto;background:#fff;border:1px solid #d9dee8;border-radius:18px;padding:28px;text-align:center;box-shadow:0 8px 24px #0a173014}h1{margin:0 0 8px}.muted{color:#627087}form{display:flex;gap:10px;justify-content:center;margin:26px 0}input{font-size:25px;letter-spacing:5px;text-align:center;padding:11px;border:1px solid #b9c4d6;border-radius:10px;width:235px}button{padding:11px 22px;border:0;border-radius:10px;background:#172b5b;color:#fff;font-weight:700}.error{color:#9b2017}@media(max-width:560px){.card{margin:0;min-height:100vh;border-radius:0;padding-top:18vh}form{display:block}button{display:block;margin:12px auto}}</style>
</head>
<body><main class="card"><h1>سلسار | SalSar</h1><p class="muted">أدخل رقم الترجمة المطبوع أسفل رمز QR</p><form id="lookup"><input id="code" dir="ltr" inputmode="numeric" autocomplete="off" maxlength="9" pattern="[0-9 ]{8,9}" placeholder="0000 0000" required><button>عرض الترجمة</button></form><p id="message" class="error"></p><small>صلاحية الترجمة 30 يومًا من تاريخ إنشائها</small></main>
<script>
async function loadCode(code){code=String(code||'').replace(/\D/g,'');let message=document.querySelector('#message');if(!/^\d{8}$/.test(code)){message.textContent='أدخل رقمًا صحيحًا من 8 أرقام';return}message.textContent='جاري تحميل الترجمة…';try{let response=await fetch('translation-public.php?code='+encodeURIComponent(code),{cache:'no-store'}),result=await response.json();if(!result.ok)throw new Error(result.error||'تعذر تحميل الترجمة');location.href='translation.html#code='+encodeURIComponent(code)}catch(error){message.textContent=error.message||'تعذر تحميل الترجمة'}}
/* v2.5.4 — الرقم يُعرَض ويُكتب مجموعتين «1234 5678» تسهيلًا للقراءة والإملاء.
   المخزَّن والمُرسَل ثمانية أرقام بلا فراغ كما كان — التغيير في العرض فقط. */
const groupCode=value=>{const digits=String(value||'').replace(/\D/g,'').slice(0,8);
  return digits.length>4?digits.slice(0,4)+' '+digits.slice(4):digits};
const field=document.querySelector('#code');
field.addEventListener('input',()=>{const atEnd=field.selectionStart===field.value.length,
  formatted=groupCode(field.value);
  if(formatted===field.value)return;
  field.value=formatted;
  if(atEnd)field.setSelectionRange(formatted.length,formatted.length);});
document.querySelector('#lookup').addEventListener('submit',event=>{event.preventDefault();loadCode(field.value)});
let requested=new URLSearchParams(location.search).get('code');if(requested){field.value=groupCode(requested);loadCode(requested)}
</script></body></html>
